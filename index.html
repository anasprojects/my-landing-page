<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Special Offer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      max-width: 560px;
      width: 100%;
      background: white;
      padding: 45px 30px;
      text-align: center;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.10);
    }

    .icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 30px;
      color: #111827;
    }

    p {
      color: #4b5563;
      font-size: 17px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 38px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
      border-radius: 9px;
    }

    .button:hover {
      background: #1d4ed8;
    }

    .note {
      margin-top: 25px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon">⭐</div>

    <h1>Discover This Special Offer</h1>

    <p>
      Learn more about this offer and check the available details
      to see whether you are eligible.
    </p>

    <a
      class="button"
      href="https://singingfiles.com/show.php?l=0&u=2544119&id=74707"
      target="_blank"
      rel="nofollow sponsored noopener">
      CONTINUE
    </a>

    <p class="note">
      Availability and eligibility may vary.
    </p>

  </div>

</body>
</html>
